  schemas:
    RequestID:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '^[A-Za-z0-9._:-]+$'
      example: 98a70ee8a919423b883c23ea275d468a
    Slug:
      type: string
      minLength: 1
      maxLength: 80
      pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
      example: tauco-cap-badak
    InternalPath:
      type: string
      pattern: '^/(?:[a-z0-9]+(?:-[a-z0-9]+)*(?:/[a-z0-9]+(?:-[a-z0-9]+)*)*)?$'
      example: /produk
    InternalHref:
      type: string
      pattern: '^/(?:[a-z0-9]+(?:-[a-z0-9]+)*(?:/[a-z0-9]+(?:-[a-z0-9]+)*)*)?(?:\?[a-z0-9-]+=[a-z0-9-]+(?:&[a-z0-9-]+=[a-z0-9-]+)*)?$'
      example: /kontak?topik=produk
    InternalLink:
      type: object
      additionalProperties: false
      required:
        - label
        - href
      properties:
        label:
          type: string
          minLength: 2
          maxLength: 80
          pattern: '^\S(?:[\s\S]*\S)?$'
        href:
          $ref: '#/components/schemas/InternalHref'
    InformativeImageAsset:
      type: object
      additionalProperties: false
      x-string-normalization: trim-on-parse-emit-canonical
      required:
        - src
        - alt
        - decorative
      properties:
        src:
          type: string
          pattern: '^/images/[a-z0-9][a-z0-9/-]*\.(?:avif|jpe?g|png|svg|webp)$'
        alt:
          type: string
          minLength: 8
          maxLength: 160
          pattern: '^\S(?:[\s\S]*\S)?$'
          not:
            pattern: '^(?:[Ff][Oo][Tt][Oo]|[Gg][Aa][Mm][Bb][Aa][Rr]|[Ii][Mm][Aa][Gg][Ee]|[Pp][Hh][Oo][Tt][Oo])(?:\s+(?:[Pp][Rr][Oo][Dd][Uu][Kk]|[Tt][Aa][Uu][Cc][Oo]|[Pp][Rr][Oo][Dd][Uu][Cc][Tt]))?$'
          description: |
            Parsers may trim authored input, but every emitted API value must
            already be canonical without leading or trailing whitespace.
            Generic image labels are rejected case-insensitively.
          x-case-insensitive-exclusion: generic-image-label-v1
        decorative:
          type: boolean
          enum:
            - false
    DecorativeImageAsset:
      type: object
      additionalProperties: false
      required:
        - src
        - alt
        - decorative
      properties:
        src:
          type: string
          pattern: '^/images/[a-z0-9][a-z0-9/-]*\.(?:avif|jpe?g|png|svg|webp)$'
        alt:
          type: string
          enum:
            - ''
        decorative:
          type: boolean
          enum:
            - true
    ImageAsset:
      oneOf:
        - $ref: '#/components/schemas/InformativeImageAsset'
        - $ref: '#/components/schemas/DecorativeImageAsset'
    SeoMetadata:
      type: object
      additionalProperties: false
      required:
        - title
        - description
        - canonicalPath
        - openGraphImage
      properties:
        title:
          type: string
          minLength: 8
          maxLength: 80
          pattern: '^\S(?:[\s\S]*\S)?$'
        description:
          type: string
          minLength: 50
          maxLength: 180
          pattern: '^\S(?:[\s\S]*\S)?$'
        canonicalPath:
          $ref: '#/components/schemas/InternalPath'
        openGraphImage:
