    ContactMessageRequest:
      type: object
      description: |
        Text input is trimmed before transport. The API rejects leading or
        trailing whitespace so every accepted payload has one canonical form.
        `phone` remains a required wire property; an empty string means omitted.
      x-string-normalization: trim-before-transport
      additionalProperties: false
      required:
        - name
        - email
        - phone
        - subject
        - message
        - privacyConsent
        - botField
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
          pattern: '^\S(?:[\s\S]*\S)?$'
        email:
          type: string
          format: email
          maxLength: 160
          pattern: '^[^\s@]+@[^\s@]+\.[^\s@]+$'
        phone:
          type: string
          maxLength: 30
          pattern: '^(?:$|[+0-9()-][+0-9()\s-]{5,28}[+0-9()-])$'
          description: Empty string means no phone number was supplied.
        subject:
          type: string
          enum:
            - Informasi produk
            - Kerja sama dan distribusi
            - Pertanyaan umum
        message:
          type: string
          minLength: 20
          maxLength: 2000
          pattern: '^\S(?:[\s\S]*\S)?$'
        privacyConsent:
          type: boolean
          enum:
            - true
        botField:
          type: string
          maxLength: 0
          description: Honeypot; must be an empty string.
    ContactMessageResult:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - received
    ContactMessageResponse:
      type: object
      additionalProperties: false
      required:
        - data
        - meta
      properties:
        data:
          $ref: '#/components/schemas/ContactMessageResult'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    ValidationError:
      type: object
      additionalProperties: false
      required:
        - field
        - code
        - message
      properties:
        field:
          type: string
          minLength: 1
          maxLength: 120
          pattern: '^\S(?:[\s\S]*\S)?$'
        code:
          type: string
          minLength: 3
          maxLength: 80
          pattern: '^[A-Z][A-Z0-9]*(?:_[A-Z0-9]+)*$'
        message:
          type: string
          minLength: 3
          maxLength: 240
          pattern: '^\S(?:[\s\S]*\S)?$'
    Problem:
      type: object
      additionalProperties: false
      required:
        - type
        - title
        - status
        - detail
        - instance
        - code
        - requestId
      properties:
        type:
          type: string
          format: uri
          maxLength: 160
          pattern: '^urn:tauco-cap-badak:problem:[a-z0-9]+(?:-[a-z0-9]+)*$'
        title:
          type: string
          minLength: 3
          maxLength: 120
          pattern: '^\S(?:[\s\S]*\S)?$'
        status:
          type: integer
          format: int32
          minimum: 400
          maximum: 599
        detail:
          type: string
          minLength: 3
          maxLength: 500
          pattern: '^\S(?:[\s\S]*\S)?$'
        instance:
          $ref: '#/components/schemas/ProblemInstance'
        code:
          type: string
          minLength: 3
          maxLength: 80
          pattern: '^[A-Z][A-Z0-9]*(?:_[A-Z0-9]+)*$'
        requestId:
          $ref: '#/components/schemas/RequestID'
        errors:
          type: array
          minItems: 1
          maxItems: 32
          items:
            $ref: '#/components/schemas/ValidationError'
    ProblemInstance:
      type: string
      format: uri-reference
      minLength: 1
      maxLength: 2048
      pattern: "^/(?:$|(?:[A-Za-z0-9._~!$&'()*+,;=:@-]|%[0-9A-Fa-f]{2})(?:[A-Za-z0-9._~!$&'()*+,;=:@/-]|%[0-9A-Fa-f]{2})*)$"
      description: |
        Absolute, path-only URI-reference built from the escaped request path.
        Uppercase segments, a trailing slash, and percent-encoded octets are
        valid. Empty, non-absolute, network-path, or oversized values fall back
        to `/` before a problem response is emitted.
      x-source: escaped-request-path
