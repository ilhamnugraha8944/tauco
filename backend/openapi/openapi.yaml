                # TYPE http_requests_total counter
                http_requests_total{method="GET",route="/health/live",status="200"} 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  securitySchemes:
    InternalMetricsBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: A dedicated rotatable operations token; never an admin JWT.
    AdminCookie:
      type: apiKey
      in: cookie
      name: tauco_admin_access
      description: Short-lived HttpOnly, Secure, SameSite=Strict admin access cookie.
    AdminCSRF:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Double-submit token required with AdminCookie on unsafe methods.
  parameters:
    XRequestID:
      name: X-Request-ID
      in: header
      required: false
      description: |
        Optional caller-provided trace identifier. Invalid values are replaced
        by the server.
      schema:
        $ref: '#/components/schemas/RequestID'
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: ETag validator returned by a prior successful content read.
      schema:
        type: string
        minLength: 3
        maxLength: 160
      example: '"sha256-8e7d6f5c4b3a"'
    Cursor:
      name: cursor
      in: query
      required: false
      description: |
        Opaque base64url cursor signed with HMAC and bound to the current
        version, filters, query hash, sort position, and product identifier.
      schema:
        type: string
        minLength: 1
        maxLength: 1024
        pattern: '^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$'
      example: eyJ2IjoxLCJzb3J0IjoxMDB9.4uM2fGfRUq7Z
    Limit:
      name: limit
      in: query
      required: false
      description: Maximum number of products in this page.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 50
        default: 20
      example: 20
    ProductSlug:
      name: slug
      in: path
      required: true
      description: Stable lowercase product slug.
      schema:
        $ref: '#/components/schemas/Slug'
      example: tauco-cap-badak
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Printable ASCII key. Only an HMAC digest of this value is persisted.
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: '^[ -~]{16,128}$'
      example: contact-20260728-000001
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Strong ETag for optimistic concurrency control.
      schema:
        type: string
        minLength: 3
        maxLength: 160
      example: '"revision-7"'
    PageKeyPath:
      name: key
      in: path
      required: true
      schema:
        type: string
        enum: [home, about]
    EntityID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UploadIntentID:
      name: intentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RevisionID:
      name: revisionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MediaWidth:
      name: width
      in: path
      required: true
      schema:
        type: integer
        minimum: 160
        maximum: 2560
    ContactStatus:
      name: status
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/ContactMessageStatus'
    ActivityEventType:
      name: eventType
      in: query
      required: false
      schema:
        type: string
        minLength: 3
        maxLength: 100
        pattern: '^[a-z][a-z0-9]*([._-][a-z0-9]+)*$'
    ActivityEntityType:
      name: entityType
      in: query
      required: false
      schema:
        type: string
        minLength: 3
        maxLength: 80
        pattern: '^[a-z][a-z0-9]*([._-][a-z0-9]+)*$'
  headers:
    XRequestID:
      description: Request trace identifier.
      required: true
      schema:
        $ref: '#/components/schemas/RequestID'
    ETag:
      description: Strong validator derived from the immutable revision checksum.
      required: true
      schema:
        type: string
      example: '"sha256-8e7d6f5c4b3a"'
    PublicCacheControl:
      description: Shared-cache policy for published public content.
      required: true
      schema:
        type: string
        enum:
          - public, max-age=0, s-maxage=300, stale-while-revalidate=60
    NoStore:
      description: Prevents storage of private or operational responses.
      required: true
      schema:
        type: string
        enum:
          - no-store
    RetryAfter:
      description: Seconds until another request may be attempted.
      required: true
      schema:
        type: integer
        format: int32
        minimum: 1
      example: 60
    IdempotencyReplayed:
      description: True only when the response is a replay of a completed request.
      required: false
      schema:
        type: boolean
      example: true
  responses:
    NotModified:
      description: Cached representation is still current
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
        ETag:
          $ref: '#/components/headers/ETag'
        Cache-Control:
          $ref: '#/components/headers/PublicCacheControl'
    BadRequest:
      description: Malformed JSON, header, cursor, or query
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            malformedRequest:
              value:
                type: urn:tauco-cap-badak:problem:bad-request
                title: Permintaan tidak valid
                status: 400
                detail: Format permintaan tidak dapat diproses.
                instance: /api/v1/contact-messages
                code: BAD_REQUEST
                requestId: 98a70ee8a919423b883c23ea275d468a
    ProductListBadRequest:
      description: Cursor, limit, request header, or query parameter is invalid
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            invalidCursor:
              value:
                type: urn:tauco-cap-badak:problem:invalid-cursor
                title: Cursor tidak valid
                status: 400
                detail: Mulai kembali dari halaman pertama.
                instance: /api/v1/products
                code: INVALID_CURSOR
                requestId: 98a70ee8a919423b883c23ea275d468a
            invalidLimit:
              value:
                type: urn:tauco-cap-badak:problem:bad-request
                title: Permintaan tidak valid
                status: 400
                detail: Limit harus bernilai antara 1 dan 50.
                instance: /api/v1/products
                code: INVALID_LIMIT
                requestId: 98a70ee8a919423b883c23ea275d468a
    ProductNotFound:
      description: No published product has the requested slug
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            missingProduct:
              value:
                type: urn:tauco-cap-badak:problem:product-not-found
                title: Produk tidak ditemukan
                status: 404
                detail: Produk yang diminta tidak ditemukan.
                instance: /api/v1/products/tidak-ada
                code: PRODUCT_NOT_FOUND
                requestId: 98a70ee8a919423b883c23ea275d468a
    IdempotencyConflict:
      description: Idempotency key was already used with a different payload
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            keyConflict:
              value:
                type: urn:tauco-cap-badak:problem:idempotency-conflict
                title: Kunci idempotensi sudah digunakan
                status: 409
                detail: Gunakan kunci baru untuk payload yang berbeda.
                instance: /api/v1/contact-messages
                code: IDEMPOTENCY_KEY_REUSED
                requestId: 98a70ee8a919423b883c23ea275d468a
    PayloadTooLarge:
      description: Request body exceeds 32 KiB
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            tooLarge:
              value:
