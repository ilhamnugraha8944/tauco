openapi: 3.0.3
info:
  title: Tauco Cap Badak Public API
  version: 1.0.0
  description: |
    Contract-first REST API for the Phase 1B shadow backend.
    This contract exposes published public content, contact intake, health, and
    protected metrics only. It intentionally contains no administration routes.
  license:
    name: Proprietary
servers:
  - url: http://127.0.0.1:8080
    description: Local development
tags:
  - name: Content
    description: Published page content
  - name: Catalog
    description: Published product catalog
  - name: Contact
    description: Public contact intake
  - name: Health
    description: Process and dependency health
  - name: Operations
    description: Protected operational endpoints
paths:
  /api/v1/home:
    get:
      tags:
        - Content
      summary: Get published homepage content
      operationId: getHome
      parameters:
        - $ref: '#/components/parameters/XRequestID'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Published homepage content
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/PublicCacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeResponse'
              examples:
                published:
                  $ref: '#/components/examples/HomeResponse'
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/about:
    get:
      tags:
        - Content
      summary: Get published about-page content
      operationId: getAbout
      parameters:
        - $ref: '#/components/parameters/XRequestID'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Published about-page content
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/PublicCacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AboutResponse'
              examples:
                published:
                  $ref: '#/components/examples/AboutResponse'
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/tauco-guide:
    get:
      tags:
        - Content
      summary: Get the published informational tauco guide
      operationId: getTaucoGuide
      parameters:
        - $ref: '#/components/parameters/XRequestID'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Published tauco guide
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/PublicCacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaucoGuideResponse'
              examples:
                published:
                  $ref: '#/components/examples/TaucoGuideResponse'
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/products:
    get:
      tags:
        - Catalog
      summary: List published products
      description: |
        Results are ordered deterministically by `sort_order ASC, id ASC`.
        Unknown query parameters are rejected. The cursor is opaque, signed,
        and bound to the query and filter state.
      operationId: listProducts
      x-reject-unknown-query-parameters: true
      parameters:
        - $ref: '#/components/parameters/XRequestID'
        - $ref: '#/components/parameters/IfNoneMatch'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A bounded page of published products
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/PublicCacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListResponse'
              examples:
                firstPage:
                  $ref: '#/components/examples/ProductListResponse'
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/ProductListBadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/products/{slug}:
    get:
      tags:
        - Catalog
      summary: Get a published product by slug
      operationId: getProductBySlug
      parameters:
        - $ref: '#/components/parameters/XRequestID'
        - $ref: '#/components/parameters/IfNoneMatch'
        - $ref: '#/components/parameters/ProductSlug'
      responses:
        '200':
          description: Published product detail
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/PublicCacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetailResponse'
              examples:
                published:
                  $ref: '#/components/examples/ProductDetailResponse'
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/ProductNotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/contact-messages:
    post:
      tags:
        - Contact
      summary: Submit a visitor contact message
      description: |
        Persists the contact message and its asynchronous notification jobs in
        one transaction. A repeated idempotency key with the same normalized
        payload returns the same semantic result without creating duplicates.
      operationId: createContactMessage
      parameters:
        - $ref: '#/components/parameters/XRequestID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        x-max-body-bytes: 32768
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactMessageRequest'
            examples:
              productQuestion:
                $ref: '#/components/examples/ContactMessageRequest'
      responses:
        '201':
          description: Contact message received
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactMessageResponse'
              examples:
                received:
                  $ref: '#/components/examples/ContactMessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /health/live:
    get:
      tags:
        - Health
      summary: Check process liveness
      description: Does not perform any network or dependency calls.
      operationId: getLiveness
      parameters:
        - $ref: '#/components/parameters/XRequestID'
      responses:
        '200':
          description: Process is alive
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LivenessResponse'
              examples:
                alive:
                  $ref: '#/components/examples/LivenessResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /health/ready:
    get:
      tags:
        - Health
      summary: Check critical dependency readiness
      description: |
        PostgreSQL must be healthy. Redis and storage may be degraded without
        making the public read and contact API unready. No endpoint or
        credential detail is returned.
      operationId: getReadiness
      parameters:
        - $ref: '#/components/parameters/XRequestID'
      responses:
        '200':
          description: API is ready; optional dependencies may be degraded
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
              examples:
                ready:
                  $ref: '#/components/examples/ReadinessResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /internal/metrics:
    get:
      tags:
        - Operations
      summary: Read Prometheus metrics
      operationId: getMetrics
      security:
        - InternalMetricsBearer: []
      parameters:
        - $ref: '#/components/parameters/XRequestID'
      responses:
        '200':
          description: Prometheus text exposition
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            text/plain:
              schema:
                type: string
              example: |
                # HELP http_requests_total Total HTTP requests.
                # TYPE http_requests_total counter
                http_requests_total{method="GET",route="/health/live",status="200"} 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  securitySchemes:
    InternalMetricsBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: A dedicated rotatable operations token; never an admin JWT.
  parameters:
    XRequestID:
      name: X-Request-ID
      in: header
      required: false
      description: |
        Optional caller-provided trace identifier. Invalid values are replaced
        by the server.
      schema:
        $ref: '#/components/schemas/RequestID'
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: ETag validator returned by a prior successful content read.
      schema:
        type: string
        minLength: 3
        maxLength: 160
      example: '"sha256-8e7d6f5c4b3a"'
    Cursor:
      name: cursor
      in: query
      required: false
      description: |
        Opaque base64url cursor signed with HMAC and bound to the current
        version, filters, query hash, sort position, and product identifier.
      schema:
        type: string
        minLength: 1
        maxLength: 1024
        pattern: '^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$'
      example: eyJ2IjoxLCJzb3J0IjoxMDB9.4uM2fGfRUq7Z
    Limit:
      name: limit
      in: query
      required: false
      description: Maximum number of products in this page.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 50
        default: 20
      example: 20
    ProductSlug:
      name: slug
      in: path
      required: true
      description: Stable lowercase product slug.
      schema:
        $ref: '#/components/schemas/Slug'
      example: tauco-cap-badak
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Printable ASCII key. Only an HMAC digest of this value is persisted.
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: '^[ -~]{16,128}$'
      example: contact-20260728-000001
  headers:
    XRequestID:
      description: Request trace identifier.
      required: true
      schema:
        $ref: '#/components/schemas/RequestID'
    ETag:
      description: Strong validator derived from the immutable revision checksum.
      required: true
      schema:
        type: string
      example: '"sha256-8e7d6f5c4b3a"'
    PublicCacheControl:
      description: Shared-cache policy for published public content.
      required: true
      schema:
        type: string
        enum:
          - public, max-age=0, s-maxage=300, stale-while-revalidate=60
    NoStore:
      description: Prevents storage of private or operational responses.
      required: true
      schema:
        type: string
        enum:
          - no-store
    RetryAfter:
      description: Seconds until another request may be attempted.
      required: true
      schema:
        type: integer
        format: int32
        minimum: 1
      example: 60
    IdempotencyReplayed:
      description: True only when the response is a replay of a completed request.
      required: false
      schema:
        type: boolean
      example: true
  responses:
    NotModified:
      description: Cached representation is still current
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
        ETag:
          $ref: '#/components/headers/ETag'
        Cache-Control:
          $ref: '#/components/headers/PublicCacheControl'
    BadRequest:
      description: Malformed JSON, header, cursor, or query
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            malformedRequest:
              value:
                type: urn:tauco-cap-badak:problem:bad-request
                title: Permintaan tidak valid
                status: 400
                detail: Format permintaan tidak dapat diproses.
                instance: /api/v1/contact-messages
                code: BAD_REQUEST
                requestId: 98a70ee8a919423b883c23ea275d468a
    ProductListBadRequest:
      description: Cursor, limit, request header, or query parameter is invalid
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            invalidCursor:
              value:
                type: urn:tauco-cap-badak:problem:invalid-cursor
                title: Cursor tidak valid
                status: 400
                detail: Mulai kembali dari halaman pertama.
                instance: /api/v1/products
                code: INVALID_CURSOR
                requestId: 98a70ee8a919423b883c23ea275d468a
            invalidLimit:
              value:
                type: urn:tauco-cap-badak:problem:bad-request
                title: Permintaan tidak valid
                status: 400
                detail: Limit harus bernilai antara 1 dan 50.
                instance: /api/v1/products
                code: INVALID_LIMIT
                requestId: 98a70ee8a919423b883c23ea275d468a
    ProductNotFound:
      description: No published product has the requested slug
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            missingProduct:
              value:
                type: urn:tauco-cap-badak:problem:product-not-found
                title: Produk tidak ditemukan
                status: 404
                detail: Produk yang diminta tidak ditemukan.
                instance: /api/v1/products/tidak-ada
                code: PRODUCT_NOT_FOUND
                requestId: 98a70ee8a919423b883c23ea275d468a
    IdempotencyConflict:
      description: Idempotency key was already used with a different payload
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            keyConflict:
              value:
                type: urn:tauco-cap-badak:problem:idempotency-conflict
                title: Kunci idempotensi sudah digunakan
                status: 409
                detail: Gunakan kunci baru untuk payload yang berbeda.
                instance: /api/v1/contact-messages
                code: IDEMPOTENCY_KEY_REUSED
                requestId: 98a70ee8a919423b883c23ea275d468a
    PayloadTooLarge:
      description: Request body exceeds 32 KiB
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            tooLarge:
              value:
                type: urn:tauco-cap-badak:problem:payload-too-large
                title: Payload terlalu besar
                status: 413
                detail: Ukuran body tidak boleh melebihi 32 KiB.
                instance: /api/v1/contact-messages
                code: PAYLOAD_TOO_LARGE
                requestId: 98a70ee8a919423b883c23ea275d468a
    UnsupportedMediaType:
      description: Content-Type is not application/json
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            unsupportedType:
              value:
                type: urn:tauco-cap-badak:problem:unsupported-media-type
                title: Media type tidak didukung
                status: 415
                detail: Gunakan Content-Type application/json.
                instance: /api/v1/contact-messages
                code: UNSUPPORTED_MEDIA_TYPE
                requestId: 98a70ee8a919423b883c23ea275d468a
    ValidationFailed:
      description: One or more semantic field validations failed
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            invalidEmail:
              value:
                type: urn:tauco-cap-badak:problem:validation
                title: Permintaan tidak valid
                status: 422
                detail: Periksa field yang ditandai.
                instance: /api/v1/contact-messages
                code: CONTACT_VALIDATION_FAILED
                requestId: 98a70ee8a919423b883c23ea275d468a
                errors:
                  - field: email
                    code: INVALID_EMAIL
                    message: Masukkan alamat email yang valid.
    TooManyRequests:
      description: Rate limit exceeded
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            rateLimited:
              value:
                type: urn:tauco-cap-badak:problem:rate-limit
                title: Terlalu banyak permintaan
                status: 429
                detail: Coba kembali setelah waktu yang ditentukan.
                instance: /api/v1/contact-messages
                code: RATE_LIMIT_EXCEEDED
                requestId: 98a70ee8a919423b883c23ea275d468a
    Unauthorized:
      description: Missing or invalid operations token
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        WWW-Authenticate:
          description: Bearer authentication challenge.
          schema:
            type: string
          example: Bearer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            unauthorized:
              value:
                type: urn:tauco-cap-badak:problem:unauthorized
                title: Autentikasi diperlukan
                status: 401
                detail: Token operasional tidak tersedia atau tidak valid.
                instance: /internal/metrics
                code: UNAUTHORIZED
                requestId: 98a70ee8a919423b883c23ea275d468a
    Forbidden:
      description: Authenticated principal is not allowed to read metrics
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            forbidden:
              value:
                type: urn:tauco-cap-badak:problem:forbidden
                title: Akses ditolak
                status: 403
                detail: Kredensial tidak memiliki akses ke resource ini.
                instance: /internal/metrics
                code: FORBIDDEN
                requestId: 98a70ee8a919423b883c23ea275d468a
    InternalServerError:
      description: Unexpected server error with no internal detail exposed
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            internal:
              value:
                type: urn:tauco-cap-badak:problem:internal
                title: Terjadi kesalahan internal
                status: 500
                detail: Permintaan tidak dapat diproses saat ini.
                instance: /api/v1/home
                code: INTERNAL_SERVER_ERROR
                requestId: 98a70ee8a919423b883c23ea275d468a
    ServiceUnavailable:
      description: A critical dependency is not ready
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            unavailable:
              value:
                type: urn:tauco-cap-badak:problem:service-unavailable
                title: Layanan belum siap
                status: 503
                detail: Coba kembali beberapa saat lagi.
                instance: /health/ready
                code: SERVICE_UNAVAILABLE
                requestId: 98a70ee8a919423b883c23ea275d468a
  schemas:
    RequestID:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '^[A-Za-z0-9._:-]+$'
      example: 98a70ee8a919423b883c23ea275d468a
    Slug:
      type: string
      minLength: 1
      maxLength: 80
      pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
      example: tauco-cap-badak
    InternalPath:
      type: string
      pattern: '^/(?:[a-z0-9]+(?:-[a-z0-9]+)*(?:/[a-z0-9]+(?:-[a-z0-9]+)*)*)?$'
      example: /produk
    InternalHref:
      type: string
      pattern: '^/(?:[a-z0-9]+(?:-[a-z0-9]+)*(?:/[a-z0-9]+(?:-[a-z0-9]+)*)*)?(?:\?[a-z0-9-]+=[a-z0-9-]+(?:&[a-z0-9-]+=[a-z0-9-]+)*)?$'
      example: /kontak?topik=produk
    InternalLink:
      type: object
      additionalProperties: false
      required:
        - label
        - href
      properties:
        label:
          type: string
          minLength: 2
          maxLength: 80
          pattern: '^\S(?:[\s\S]*\S)?$'
        href:
          $ref: '#/components/schemas/InternalHref'
    InformativeImageAsset:
      type: object
      additionalProperties: false
      x-string-normalization: trim-on-parse-emit-canonical
      required:
        - src
        - alt
        - decorative
      properties:
        src:
          type: string
          pattern: '^/images/[a-z0-9][a-z0-9/-]*\.(?:avif|jpe?g|png|svg|webp)$'
        alt:
          type: string
          minLength: 8
          maxLength: 160
          pattern: '^\S(?:[\s\S]*\S)?$'
          not:
