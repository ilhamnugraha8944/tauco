openapi: 3.0.3
info:
  title: Tauco Cap Badak API
  version: 1.2.0
  description: |
    Contract-first REST API for the Phase 1B public backend and the Phase 1C
    local shadow CMS. Administration operations are contractual only in C1 and
    are not registered by the runtime until their implementation gate.
  license:
    name: Proprietary
servers:
  - url: http://127.0.0.1:8080
    description: Local development
tags:
  - name: Content
    description: Published page content
  - name: Catalog
    description: Published product catalog
  - name: Contact
    description: Public contact intake
  - name: Health
    description: Process and dependency health
  - name: Operations
    description: Protected operational endpoints
  - name: Admin authentication
    description: Password, TOTP, session, and recovery-code operations
  - name: Admin content
    description: Home and About revision management
  - name: Admin products
    description: Product lifecycle and revision management
  - name: Admin media
    description: Media upload and processing status
  - name: Admin inbox
    description: Contact inbox management
  - name: Admin activity
    description: Append-only activity history
paths:
  /api/v1/home:
    get:
      tags:
        - Content
      summary: Get published homepage content
      operationId: getHome
      parameters:
        - $ref: '#/components/parameters/XRequestID'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Published homepage content
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/PublicCacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeResponse'
              examples:
                published:
                  $ref: '#/components/examples/HomeResponse'
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/about:
    get:
      tags:
        - Content
      summary: Get published about-page content
      operationId: getAbout
      parameters:
        - $ref: '#/components/parameters/XRequestID'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Published about-page content
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/PublicCacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AboutResponse'
              examples:
                published:
                  $ref: '#/components/examples/AboutResponse'
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/tauco-guide:
    get:
      tags:
        - Content
      summary: Get the published informational tauco guide
      operationId: getTaucoGuide
      parameters:
        - $ref: '#/components/parameters/XRequestID'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Published tauco guide
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/PublicCacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaucoGuideResponse'
              examples:
                published:
                  $ref: '#/components/examples/TaucoGuideResponse'
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/products:
    get:
      tags:
        - Catalog
      summary: List published products
      description: |
        Results are ordered deterministically by `sort_order ASC, id ASC`.
        Unknown query parameters are rejected. The cursor is opaque, signed,
        and bound to the query and filter state.
      operationId: listProducts
      x-reject-unknown-query-parameters: true
      parameters:
        - $ref: '#/components/parameters/XRequestID'
        - $ref: '#/components/parameters/IfNoneMatch'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A bounded page of published products
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/PublicCacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListResponse'
              examples:
                firstPage:
                  $ref: '#/components/examples/ProductListResponse'
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/ProductListBadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/products/{slug}:
    get:
      tags:
        - Catalog
      summary: Get a published product by slug
      operationId: getProductBySlug
      parameters:
        - $ref: '#/components/parameters/XRequestID'
        - $ref: '#/components/parameters/IfNoneMatch'
        - $ref: '#/components/parameters/ProductSlug'
      responses:
        '200':
          description: Published product detail
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/PublicCacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetailResponse'
              examples:
                published:
                  $ref: '#/components/examples/ProductDetailResponse'
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/ProductNotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/contact-messages:
    post:
      tags:
        - Contact
      summary: Submit a visitor contact message
      description: |
        Persists the contact message and its asynchronous notification jobs in
        one transaction. A repeated idempotency key with the same normalized
        payload returns the same semantic result without creating duplicates.
      operationId: createContactMessage
      parameters:
        - $ref: '#/components/parameters/XRequestID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        x-max-body-bytes: 32768
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactMessageRequest'
            examples:
              productQuestion:
                $ref: '#/components/examples/ContactMessageRequest'
      responses:
        '201':
          description: Contact message received
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactMessageResponse'
              examples:
                received:
                  $ref: '#/components/examples/ContactMessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/admin/auth/login:
    post:
      tags: [Admin authentication]
      summary: Authenticate an admin with password and mandatory second factor
      operationId: adminLogin
      parameters:
        - $ref: '#/components/parameters/XRequestID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminLoginRequest'
      responses:
        '200':
          $ref: '#/components/responses/AdminAuthOK'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/admin/auth/totp/setup:
    post:
      tags: [Admin authentication]
      summary: Start mandatory TOTP enrollment
      operationId: adminSetupTotp
      security:
        - AdminCookie: []
          AdminCSRF: []
      parameters:
        - $ref: '#/components/parameters/XRequestID'
      responses:
        '200':
          $ref: '#/components/responses/AdminTotpSetupOK'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/admin/auth/totp/enable:
    post:
      tags: [Admin authentication]
      summary: Confirm TOTP enrollment and return one-time recovery codes
      operationId: adminEnableTotp
      security:
        - AdminCookie: []
          AdminCSRF: []
      parameters:
        - $ref: '#/components/parameters/XRequestID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminTotpCodeRequest'
      responses:
        '200':
          $ref: '#/components/responses/AdminRecoveryCodesOK'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/admin/auth/refresh:
    post:
      tags: [Admin authentication]
      summary: Rotate the refresh token and access session
      operationId: adminRefreshSession
      security:
        - AdminCookie: []
          AdminCSRF: []
      parameters:
        - $ref: '#/components/parameters/XRequestID'
      responses:
        '200':
          $ref: '#/components/responses/AdminAuthOK'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/admin/auth/logout:
    post:
      tags: [Admin authentication]
      summary: Revoke the current admin session
      operationId: adminLogout
      security:
        - AdminCookie: []
          AdminCSRF: []
      parameters:
        - $ref: '#/components/parameters/XRequestID'
      responses:
        '204':
          $ref: '#/components/responses/AdminNoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/admin/auth/me:
    get:
      tags: [Admin authentication]
      summary: Get the authenticated admin and effective permissions
      operationId: adminGetMe
      security:
        - AdminCookie: []
      parameters:
        - $ref: '#/components/parameters/XRequestID'
      responses:
        '200':
          $ref: '#/components/responses/AdminUserOK'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/admin/auth/recovery-codes/regenerate:
    post:
      tags: [Admin authentication]
      summary: Replace all unused recovery codes after TOTP confirmation
      operationId: adminRegenerateRecoveryCodes
      security:
        - AdminCookie: []
          AdminCSRF: []
      parameters:
        - $ref: '#/components/parameters/XRequestID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminTotpCodeRequest'
      responses:
        '200':
          $ref: '#/components/responses/AdminRecoveryCodesOK'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/admin/pages/{key}:
    get:
      tags: [Admin content]
      summary: Get Home or About with its revision pointers
      operationId: adminGetPage
      security:
        - AdminCookie: []
      parameters:
        - $ref: '#/components/parameters/XRequestID'
        - $ref: '#/components/parameters/PageKeyPath'
      responses:
        '200':
          $ref: '#/components/responses/AdminPageOK'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/admin/pages/{key}/drafts:
    post:
      tags: [Admin content]
      summary: Save an immutable Home or About draft revision
      operationId: adminCreatePageDraft
      security:
        - AdminCookie: []
          AdminCSRF: []
      parameters:
        - $ref: '#/components/parameters/XRequestID'
        - $ref: '#/components/parameters/PageKeyPath'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminPageDraftRequest'
      responses:
        '201':
          $ref: '#/components/responses/AdminRevisionCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/admin/pages/{key}/revisions/{revisionId}:
    get:
      tags: [Admin content]
      summary: Get one immutable page revision
      operationId: adminGetPageRevision
      security:
        - AdminCookie: []
      parameters:
        - $ref: '#/components/parameters/XRequestID'
        - $ref: '#/components/parameters/PageKeyPath'
        - $ref: '#/components/parameters/RevisionID'
      responses:
        '200':
          $ref: '#/components/responses/AdminRevisionOK'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/admin/pages/{key}/revisions/{revisionId}/publish:
    post:
      tags: [Admin content]
      summary: Publish a new immutable snapshot from a page revision
      operationId: adminPublishPageRevision
      security:
        - AdminCookie: []
          AdminCSRF: []
      parameters:
        - $ref: '#/components/parameters/XRequestID'
        - $ref: '#/components/parameters/PageKeyPath'
        - $ref: '#/components/parameters/RevisionID'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          $ref: '#/components/responses/AdminRevisionOK'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/admin/pages/{key}/unpublish:
    post:
      tags: [Admin content]
      summary: Clear a page public pointer without deleting revisions
      operationId: adminUnpublishPage
      security:
        - AdminCookie: []
          AdminCSRF: []
      parameters:
        - $ref: '#/components/parameters/XRequestID'
        - $ref: '#/components/parameters/PageKeyPath'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          $ref: '#/components/responses/AdminNoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/admin/products:
    get:
      tags: [Admin products]
      summary: List products including unpublished and archived records
      operationId: adminListProducts
      security:
        - AdminCookie: []
      parameters:
        - $ref: '#/components/parameters/XRequestID'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/AdminProductListOK'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Admin products]
      summary: Create an unpublished product shell
      operationId: adminCreateProduct
      security:
        - AdminCookie: []
          AdminCSRF: []
      parameters:
        - $ref: '#/components/parameters/XRequestID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminProductCreateRequest'
      responses:
        '201':
          $ref: '#/components/responses/AdminProductCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/admin/products/{id}:
    get:
      tags: [Admin products]
      summary: Get one product and its revision pointers
      operationId: adminGetProduct
      security:
        - AdminCookie: []
      parameters:
        - $ref: '#/components/parameters/XRequestID'
        - $ref: '#/components/parameters/EntityID'
      responses:
        '200':
          $ref: '#/components/responses/AdminProductOK'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags: [Admin products]
      summary: Update product identity and ordering fields
      operationId: adminUpdateProduct
      security:
        - AdminCookie: []
          AdminCSRF: []
      parameters:
        - $ref: '#/components/parameters/XRequestID'
        - $ref: '#/components/parameters/EntityID'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminProductUpdateRequest'
      responses:
        '200':
          $ref: '#/components/responses/AdminProductOK'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/admin/products/{id}/drafts:
    post:
      tags: [Admin products]
      summary: Save an immutable product draft revision
      operationId: adminCreateProductDraft
      security:
        - AdminCookie: []
          AdminCSRF: []
      parameters:
        - $ref: '#/components/parameters/XRequestID'
        - $ref: '#/components/parameters/EntityID'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminProductDraftRequest'
      responses:
        '201':
          $ref: '#/components/responses/AdminRevisionCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/admin/products/{id}/revisions/{revisionId}:
    get:
      tags: [Admin products]
      summary: Get one immutable product revision
      operationId: adminGetProductRevision
      security:
        - AdminCookie: []
      parameters:
        - $ref: '#/components/parameters/XRequestID'
        - $ref: '#/components/parameters/EntityID'
        - $ref: '#/components/parameters/RevisionID'
      responses:
        '200':
          $ref: '#/components/responses/AdminRevisionOK'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/admin/products/{id}/revisions/{revisionId}/publish:
    post:
      tags: [Admin products]
      summary: Publish a new immutable snapshot from a product revision
      operationId: adminPublishProductRevision
      security:
        - AdminCookie: []
          AdminCSRF: []
      parameters:
        - $ref: '#/components/parameters/XRequestID'
        - $ref: '#/components/parameters/EntityID'
        - $ref: '#/components/parameters/RevisionID'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          $ref: '#/components/responses/AdminRevisionOK'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
